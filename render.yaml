services:
  - type: web
    name: parcel-resolver-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn parcel_resolver.api.resolve:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CORS_ORIGINS
        sync: false
